plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.0.0'
group = 'com.hex'

base {
    archivesName = 'aibridge'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = '21.1.233'

    runs {
        // 不需要跑开发客户端，只构建 jar；保留空配置避免插件告警
    }

    mods {
        aibridge {
            sourceSet sourceSets.main
        }
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : 'aibridge',
            'Implementation-Title'  : 'AI Bridge',
            'Implementation-Version': project.version
        ])
    }
}
